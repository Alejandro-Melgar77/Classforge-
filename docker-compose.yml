version: '3.8'

# Para levantar el stack crea un archivo .env junto a este compose con:
#   SECRET_KEY=<cadena larga y aleatoria>
#   MONGO_USER=classforge
#   MONGO_PASSWORD=<contraseña fuerte>
# `SECRET_KEY` es obligatoria: el backend la valida en producción.

services:
  mongodb:
    image: mongo:6.0
    container_name: classforge-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: classforge
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-classforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-classforge_dev_password}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - classforge-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./classforge-backend
      dockerfile: Dockerfile
    container_name: classforge-backend
    restart: always
    environment:
      - PROJECT_NAME=ClassForge
      - ENVIRONMENT=production
      - API_V1_STR=/api/v1
      # Obligatoria: si falta, docker compose se detiene en vez de arrancar con
      # una clave conocida.
      - SECRET_KEY=${SECRET_KEY:?Define SECRET_KEY en el .env del proyecto}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - MONGODB_URL=mongodb://${MONGO_USER:-classforge}:${MONGO_PASSWORD:-classforge_dev_password}@mongodb:27017/?authSource=admin
      - DATABASE_NAME=classforge
      - INACTIVITY_TIMEOUT_MINUTES=30
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:4200
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - classforge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./classforge-frontend
      dockerfile: Dockerfile
    container_name: classforge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - classforge-net

volumes:
  mongo_data:

networks:
  classforge-net:
    driver: bridge
