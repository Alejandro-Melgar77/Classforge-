name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.11 & MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: classforge-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'classforge-backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: classforge_test
          SECRET_KEY: test-secret-key-for-ci
        run: pytest -q

  frontend:
    name: Frontend (Node 20 & Angular 17)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: classforge-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'classforge-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (production)
        run: npx ng build --configuration production --stats-json

  codegen-springboot:
    name: Codegen Real Compilation (JDK 17 & Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classforge-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'classforge-backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and compile Spring Boot fixtures
        run: python scripts/compile_springboot_fixtures.py

  mobile:
    name: Mobile (Flutter Analyze)
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: classforge-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'classforge-backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: classforge-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend with fake LLM
        working-directory: classforge-backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: classforge_e2e
          SECRET_KEY: test-secret-key-for-e2e
          LLM_PROVIDER: fake
          CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/ > /dev/null; do sleep 1; done'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'classforge-frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: classforge-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: classforge-frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: classforge-frontend
        run: npm run e2e

      - name: Upload Playwright report and traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            classforge-frontend/test-results/
            classforge-frontend/playwright-report/
          retention-days: 7
