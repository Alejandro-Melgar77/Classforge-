<div class="h-9 bg-[var(--surface-2)]/95 border-b border-[var(--border)] flex items-center px-2 gap-1 select-none w-full justify-between"
     data-tour="toolbar"
     role="toolbar"
     aria-label="Barra de herramientas del editor">

  <!-- Left: Essential Actions (Undo/Redo, Zoom, Fit, Reset) ALWAYS VISIBLE -->
  <div class="flex items-center gap-0.5 shrink-0">
    <!-- Grupo Deshacer / Rehacer -->
    <div class="flex items-center gap-0.5" role="group" aria-label="Historial">
      <button (click)="undo()" class="toolbar-btn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">
        <lucide-icon name="undo" [size]="14"></lucide-icon>
      </button>
      <button (click)="redo()" class="toolbar-btn" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">
        <lucide-icon name="redo" [size]="14"></lucide-icon>
      </button>
    </div>

    <div class="w-px h-4 bg-[var(--border)] mx-1" aria-hidden="true"></div>

    <!-- Grupo Zoom & Ajuste (Always visible) -->
    <div class="flex items-center gap-0.5" role="group" aria-label="Zoom y Vista">
      <button (click)="zoomOut()" class="toolbar-btn" title="Alejar (-)" aria-label="Alejar">
        <lucide-icon name="zoom-out" [size]="14"></lucide-icon>
      </button>
      <button (click)="resetZoom()" class="toolbar-btn font-mono text-[10px] font-bold px-1.5 min-w-[42px]" title="Resetear zoom al 100%">
        {{ (canvasService.getZoom() * 100) | number:'1.0-0' }}%
      </button>
      <button (click)="zoomIn()" class="toolbar-btn" title="Acercar (+)" aria-label="Acercar">
        <lucide-icon name="zoom-in" [size]="14"></lucide-icon>
      </button>
      <button (click)="fitView()" class="toolbar-btn" title="Ajustar a pantalla (F)" aria-label="Ajustar vista">
        <lucide-icon name="maximize" [size]="14"></lucide-icon>
      </button>
    </div>

    <div class="w-px h-4 bg-[var(--border)] mx-1 hidden sm:block" aria-hidden="true"></div>

    <!-- Secondary Actions: Direct on medium/large screens (>= 1024px / lg) -->
    <div class="hidden lg:flex items-center gap-0.5" role="group" aria-label="Herramientas secundarias">
      <button (click)="copy()" class="toolbar-btn" title="Copiar (Ctrl+C)">
        <lucide-icon name="copy" [size]="14"></lucide-icon>
      </button>
      <button (click)="paste()" class="toolbar-btn" title="Pegar (Ctrl+V)">
        <lucide-icon name="clipboard-paste" [size]="14"></lucide-icon>
      </button>
      <button (click)="deleteSelected()" class="toolbar-btn hover:!text-red-400" title="Eliminar selección (Supr)">
        <lucide-icon name="trash-2" [size]="14"></lucide-icon>
      </button>
      <button (click)="autoLayout()" class="toolbar-btn" title="Auto-distribuir clases">
        <lucide-icon name="layout-grid" [size]="14"></lucide-icon>
      </button>

      <!-- Exportar -->
      <div class="relative">
        <button (click)="toggleExportMenu()" class="toolbar-btn flex items-center gap-1 font-medium text-[11px]" title="Exportar diagrama">
          <lucide-icon name="download" [size]="14"></lucide-icon>
          <span>Exportar</span>
          <span class="text-[8px]">▼</span>
        </button>
        <div *ngIf="exportMenuOpen" class="absolute left-0 top-full mt-1 w-40 bg-[var(--surface-3)] border border-[var(--border)] rounded-lg shadow-2xl overflow-hidden py-1 z-50 animate-in fade-in duration-100">
          <button (click)="exportPng()" class="w-full text-left px-3 py-1.5 text-xs text-[var(--text-primary)] hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
            <span>📷</span> <span>Exportar PNG</span>
          </button>
          <button (click)="exportPdf()" class="w-full text-left px-3 py-1.5 text-xs text-[var(--text-primary)] hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
            <span>📄</span> <span>Exportar PDF</span>
          </button>
          <div class="h-px bg-[var(--border)] my-0.5"></div>
          <button (click)="exportXmi()" class="w-full text-left px-3 py-1.5 text-xs text-[var(--text-primary)] hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
            <span>📦</span> <span>Exportar XMI</span>
          </button>
          <button (click)="exportJson()" class="w-full text-left px-3 py-1.5 text-xs text-[var(--text-primary)] hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
            <span>📋</span> <span>Exportar JSON</span>
          </button>
        </div>
      </div>

      <!-- Importar -->
      <label class="toolbar-btn flex items-center gap-1 cursor-pointer text-[11px]" title="Importar XMI o JSON">
        <lucide-icon name="upload" [size]="14"></lucide-icon>
        <span>Importar</span>
        <input type="file" accept=".xmi,.xml,.json" (change)="importXmi($event)" class="hidden">
      </label>

      <button (click)="openShortcuts.emit()" class="toolbar-btn text-amber-400 hover:text-amber-300" title="Atajos de teclado (?)">
        <lucide-icon name="help-circle" [size]="14"></lucide-icon>
      </button>
    </div>

    <!-- Dropdown compacto 'Más acciones' (< 1024px) -->
    <div class="lg:hidden relative">
      <button (click)="toggleMoreMenu()" 
              class="toolbar-btn flex items-center gap-1 font-semibold text-xs px-2 py-0.5 rounded bg-[var(--surface-3)]/60 text-slate-300 hover:text-white"
              title="Más herramientas y opciones">
        <lucide-icon name="more-horizontal" [size]="14"></lucide-icon>
        <span class="text-[11px]">Más</span>
      </button>

      <div *ngIf="moreMenuOpen" 
           class="absolute left-0 top-full mt-1 w-52 bg-[var(--surface-3)] border border-[var(--border)] rounded-xl shadow-2xl py-1.5 z-50 animate-in fade-in duration-100 flex flex-col gap-0.5 text-xs">
        <button (click)="copy(); closeMenus()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <lucide-icon name="copy" [size]="13"></lucide-icon> <span>Copiar selección (Ctrl+C)</span>
        </button>
        <button (click)="paste(); closeMenus()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <lucide-icon name="clipboard-paste" [size]="13"></lucide-icon> <span>Pegar (Ctrl+V)</span>
        </button>
        <button (click)="deleteSelected(); closeMenus()" class="w-full text-left px-3 py-1.5 hover:bg-rose-500/20 text-rose-400 flex items-center gap-2 cursor-pointer">
          <lucide-icon name="trash-2" [size]="13"></lucide-icon> <span>Eliminar selección (Supr)</span>
        </button>
        <div class="h-px bg-[var(--border)] my-1"></div>
        <button (click)="autoLayout(); closeMenus()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <lucide-icon name="layout-grid" [size]="13"></lucide-icon> <span>Auto-distribuir clases</span>
        </button>
        <button (click)="exportPng()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <span>📷</span> <span>Exportar como PNG</span>
        </button>
        <button (click)="exportPdf()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <span>📄</span> <span>Exportar como PDF</span>
        </button>
        <button (click)="exportXmi()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] flex items-center gap-2 cursor-pointer">
          <span>📦</span> <span>Exportar como XMI</span>
        </button>
        <div class="h-px bg-[var(--border)] my-1"></div>
        <button (click)="openShortcuts.emit(); closeMenus()" class="w-full text-left px-3 py-1.5 hover:bg-[var(--surface-4)] text-amber-300 flex items-center gap-2 cursor-pointer">
          <lucide-icon name="help-circle" [size]="13"></lucide-icon> <span>Atajos de teclado</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Right: Asistente IA, Guardar y AutoSave (ALWAYS VISIBLE) -->
  <div class="flex items-center gap-1.5 shrink-0">
    <!-- Asistente IA Button -->
    <button (click)="toggleAiAssistant.emit()"
            class="flex items-center gap-1 px-2.5 py-0.5 bg-gradient-to-r from-purple-600/30 to-blue-600/30 text-purple-300 border border-purple-500/40 rounded text-xs hover:from-purple-600/50 hover:to-blue-600/50 transition-all font-semibold cursor-pointer shadow-xs"
            title="Abrir Asistente IA Multimodal (Texto, Voz, Imagen)">
      <lucide-icon name="sparkles" [size]="13" class="text-purple-300"></lucide-icon>
      <span class="hidden sm:inline">Asistente IA</span>
    </button>

    <!-- Guardar Manual Button -->
    <button (click)="autoSave.forceSaveNow()"
            [disabled]="autoSave.saveStatus() === 'saving' || autoSave.saveStatus() === 'saved'"
            class="px-2.5 py-0.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded text-xs font-bold transition-all shadow-xs cursor-pointer"
            title="Guardar ahora en el servidor (Ctrl+S)">
      Guardar
    </button>

    <!-- AutoSave Status Indicator -->
    <div class="flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-full transition-all shrink-0"
         [ngClass]="{
           'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20': autoSave.saveStatus() === 'saved',
           'text-amber-400 bg-amber-500/10 border border-amber-500/20': autoSave.saveStatus() === 'saving',
           'text-slate-400 bg-slate-500/10 border border-slate-500/20': autoSave.saveStatus() === 'unsaved',
           'text-rose-400 bg-rose-500/15 border border-rose-500/30': autoSave.saveStatus() === 'error'
         }"
         role="status"
         aria-live="polite">
      
      <span class="w-1.5 h-1.5 rounded-full"
            [ngClass]="{
              'bg-emerald-400': autoSave.saveStatus() === 'saved',
              'bg-amber-400 animate-pulse': autoSave.saveStatus() === 'saving',
              'bg-slate-400': autoSave.saveStatus() === 'unsaved',
              'bg-rose-400': autoSave.saveStatus() === 'error'
            }"></span>

      <span class="capitalize hidden md:inline">
        <ng-container [ngSwitch]="autoSave.saveStatus()">
          <span *ngSwitchCase="'saved'">Guardado</span>
          <span *ngSwitchCase="'saving'">Guardando...</span>
          <span *ngSwitchCase="'unsaved'">Sin guardar</span>
          <span *ngSwitchCase="'error'">Error</span>
        </ng-container>
      </span>

      <button *ngIf="autoSave.saveStatus() === 'error'"
              (click)="retrySave()"
              class="text-[10px] underline hover:text-white ml-0.5 cursor-pointer font-bold"
              title="Reintentar guardado">
        ↻
      </button>
    </div>
  </div>

</div>
