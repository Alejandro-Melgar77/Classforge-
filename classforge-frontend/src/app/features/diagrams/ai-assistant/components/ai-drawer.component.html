<aside 
  class="ai-drawer fixed right-0 top-0 h-full bg-slate-900 border-l border-slate-700/80 shadow-2xl transition-transform duration-300 z-50 flex flex-col text-slate-200 max-w-[96vw]"
  [style.width.px]="drawerWidth"
  [class.translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
  role="region"
  aria-label="Panel de Asistente IA y Equipo Colaborativo"
>
  <!-- Resize Handle (Left border) -->
  <div 
    class="resize-handle absolute left-0 top-0 bottom-0 w-2 hover:w-3 bg-transparent hover:bg-blue-500/50 cursor-ew-resize transition-all z-20 flex items-center justify-center group"
    (mousedown)="startResize($event)"
    [title]="i18n.drawer.resizeHandleTitle"
    aria-hidden="true"
  >
    <div class="w-0.5 h-10 bg-slate-600 group-hover:bg-blue-400 rounded-full"></div>
  </div>

  <!-- Drawer Main Header -->
  <header class="p-3 border-b border-slate-800 bg-slate-950 flex items-center justify-between gap-2 select-none shrink-0">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center text-white text-base shadow-md shrink-0">
        ✨
      </div>
      <div class="min-w-0">
        <h3 class="text-xs font-bold text-white leading-tight truncate">
          {{ mainTab() === 'commands' ? i18n.tabs.commands : i18n.tabs.aiTeam }}
        </h3>
        <span class="text-[10px] text-slate-400 block truncate">
          {{ authService.getCurrentUser()?.name || 'ClassForge IA' }}
        </span>
      </div>
    </div>

    <!-- Sizing Presets & Close Button -->
    <div class="flex items-center gap-1 shrink-0">
      <button 
        (click)="setDrawerWidth(400)" 
        class="px-2 py-1 text-[10px] rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer min-h-[28px]"
        [title]="i18n.drawer.sizePreset('S (400px)')"
      >
        {{ i18n.drawer.sizeSmall }}
      </button>
      <button 
        (click)="setDrawerWidth(540)" 
        class="px-2 py-1 text-[10px] rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer min-h-[28px]"
        [title]="i18n.drawer.sizePreset('M (540px)')"
      >
        {{ i18n.drawer.sizeMedium }}
      </button>
      <button 
        (click)="setDrawerWidth(760)" 
        class="px-2 py-1 text-[10px] rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer min-h-[28px]"
        [title]="i18n.drawer.sizePreset('L (760px)')"
      >
        {{ i18n.drawer.sizeLarge }}
      </button>
      <button 
        (click)="close.emit()" 
        class="p-1.5 text-slate-400 hover:text-white rounded hover:bg-slate-800 transition-colors cursor-pointer min-h-[32px] min-w-[32px] flex items-center justify-center text-sm"
        [title]="i18n.drawer.closeAriaLabel"
        [attr.aria-label]="i18n.drawer.closeAriaLabel"
      >
        ✕
      </button>
    </div>
  </header>

  <!-- Primary Tab Selector: Comandos vs Equipo IA -->
  <nav class="flex border-b border-slate-800 bg-slate-950/90 px-3 pt-1 select-none shrink-0" role="tablist">
    <button 
      (click)="setTab('commands')"
      class="flex-1 py-2 px-2 text-xs font-bold border-b-2 transition-all flex items-center justify-center gap-1.5 cursor-pointer min-h-[40px]"
      [ngClass]="mainTab() === 'commands' 
        ? 'text-blue-400 border-blue-500' 
        : 'text-slate-400 border-transparent hover:text-slate-200'"
      role="tab"
      [attr.aria-selected]="mainTab() === 'commands'"
      aria-controls="drawer-tab-commands"
    >
      <span>⚡</span>
      <span>{{ i18n.tabs.commands }}</span>
    </button>

    <button 
      (click)="setTab('ai-team')"
      class="flex-1 py-2 px-2 text-xs font-bold border-b-2 transition-all flex items-center justify-center gap-1.5 cursor-pointer min-h-[40px] relative"
      [ngClass]="mainTab() === 'ai-team' 
        ? 'text-purple-400 border-purple-500' 
        : 'text-slate-400 border-transparent hover:text-slate-200'"
      role="tab"
      [attr.aria-selected]="mainTab() === 'ai-team'"
      aria-controls="drawer-tab-ai-team"
    >
      <span>👥</span>
      <span>{{ i18n.tabs.aiTeam }}</span>
      <span 
        *ngIf="store.unreadCount().personal + store.unreadCount().project > 0"
        class="px-1.5 py-0.2 rounded-full text-[9px] bg-purple-600 text-white font-bold"
      >
        {{ store.unreadCount().personal + store.unreadCount().project }}
      </span>
    </button>
  </nav>

  <!-- Tab Contents -->
  <main class="flex-1 overflow-hidden relative">
    <!-- Tab 1: Comandos Console -->
    <div 
      id="drawer-tab-commands" 
      *ngIf="mainTab() === 'commands'"
      class="h-full w-full"
      role="tabpanel"
    >
      <app-command-console 
        [diagramId]="diagramId" 
        [projectId]="projectId"
      ></app-command-console>
    </div>

    <!-- Tab 2: Equipo IA Panel (Chat, Historial, Tareas) -->
    <div 
      id="drawer-tab-ai-team" 
      *ngIf="mainTab() === 'ai-team'"
      class="h-full w-full"
      role="tabpanel"
    >
      <app-ai-team-panel 
        [diagramId]="diagramId" 
        [projectId]="projectId"
      ></app-ai-team-panel>
    </div>
  </main>
</aside>
