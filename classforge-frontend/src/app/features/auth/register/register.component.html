<div class="min-h-screen flex">
  <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-[var(--surface-1)] to-[var(--surface-2)] items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-primary/10 animate-pulse"></div>
    <div class="relative z-10 text-center p-8">
      <h1 class="text-5xl font-bold text-white mb-4">ClassForge</h1>
      <p class="text-xl text-[var(--text-secondary)]">Create an account to start diagramming.</p>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center bg-[var(--surface-1)] p-8">
    <div class="w-full max-w-md bg-[var(--surface-2)] rounded-xl border border-[var(--border)] p-8 shadow-lg">
      <h2 class="text-2xl font-bold text-white mb-6">Create Account</h2>
      
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-danger/20 border border-danger/30 text-danger rounded-lg">
        {{ errorMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1">Name</label>
          <input type="text" formControlName="name" class="w-full bg-[var(--surface-3)] border border-[var(--border)] rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1">Email</label>
          <input type="email" formControlName="email" class="w-full bg-[var(--surface-3)] border border-[var(--border)] rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1">Password</label>
          <input type="password" formControlName="password" class="w-full bg-[var(--surface-3)] border border-[var(--border)] rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition">
          <div class="mt-2 h-1 w-full bg-[var(--surface-4)] rounded-full overflow-hidden">
             <div class="h-full bg-warning w-1/3 transition-all"></div>
          </div>
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading" 
                class="w-full bg-primary hover:bg-primary-dark text-white rounded-lg px-6 py-3 font-medium transition-colors disabled:opacity-50">
          {{ isLoading ? 'Registering...' : 'Register' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-[var(--text-secondary)]">
        Already have an account? <a routerLink="/auth/login" class="text-primary hover:text-primary-light">Sign in</a>
      </p>
    </div>
  </div>
</div>
