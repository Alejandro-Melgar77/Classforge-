<div class="flex h-screen bg-[var(--surface-1)]">
  <!-- Mobile overlay backdrop -->
  <div *ngIf="isMobileOpen" (click)="toggleMobileMenu()" class="fixed inset-0 bg-black/50 z-40 md:hidden"></div>

  <!-- Sidebar -->
  <aside [class.translate-x-0]="isMobileOpen" [class.-translate-x-full]="!isMobileOpen"
         [class.md:w-64]="isSidebarExpanded" [class.md:w-16]="!isSidebarExpanded"
         class="fixed md:relative z-50 h-full bg-[var(--surface-2)] border-r border-[var(--border)] flex flex-col transition-all duration-300 transform md:translate-x-0 w-64 md:w-auto">
    
    <div class="h-16 flex items-center justify-between px-4 border-b border-[var(--border)]">
      <div class="flex items-center gap-2 overflow-hidden" [class.opacity-0]="!isSidebarExpanded" [class.md:opacity-0]="!isSidebarExpanded && !isMobileOpen">
        <div class="w-8 h-8 bg-primary rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-white">CF</div>
        <span class="font-bold text-white text-xl whitespace-nowrap">ClassForge</span>
      </div>
      <button (click)="toggleSidebar()" class="hidden md:flex text-[var(--text-secondary)] hover:text-white absolute right-4">
        ☰
      </button>
      <button (click)="toggleMobileMenu()" class="md:hidden text-[var(--text-secondary)] hover:text-white">
        ✕
      </button>
    </div>

    <nav class="flex-1 py-4 overflow-y-auto overflow-x-hidden">
      <ng-container *ngFor="let item of navItems">
        <div *ngIf="isMenuItemVisible(item)" class="mb-1 px-2">
          
          <a *ngIf="!item.children" [routerLink]="item.route" routerLinkActive="bg-primary text-white" [routerLinkActiveOptions]="{exact: false}"
             [attr.data-tour]="item.route === '/diagrams' ? 'nav-diagrams' : (item.route === '/dashboard' ? 'nav-dashboard' : null)"
             class="flex items-center gap-3 px-2 py-2 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--surface-3)] hover:text-white transition-colors cursor-pointer"
             [title]="!isSidebarExpanded ? item.label : ''">
            <span class="w-6 text-center">⭐</span> <!-- Replace with Lucide icon -->
            <span *ngIf="isSidebarExpanded" class="whitespace-nowrap">{{ item.label }}</span>
          </a>

          <div *ngIf="item.children" class="flex flex-col" [attr.data-tour]="item.label === 'Repertorio' ? 'nav-repertoire' : null">
            <div (click)="item.expanded = !item.expanded" 
                 class="flex items-center justify-between px-2 py-2 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--surface-3)] hover:text-white transition-colors cursor-pointer"
                 [title]="!isSidebarExpanded ? item.label : ''">
              <div class="flex items-center gap-3">
                <span class="w-6 text-center">📁</span>
                <span *ngIf="isSidebarExpanded" class="whitespace-nowrap">{{ item.label }}</span>
              </div>
              <span *ngIf="isSidebarExpanded" class="text-xs transition-transform" [class.rotate-180]="item.expanded">▼</span>
            </div>
            
            <div *ngIf="item.expanded && isSidebarExpanded" class="pl-8 pr-2 mt-1 flex flex-col gap-1">
              <a *ngFor="let child of item.children" [routerLink]="child.route" routerLinkActive="text-primary font-medium"
                 class="px-2 py-1.5 rounded-lg text-sm text-[var(--text-muted)] hover:text-white hover:bg-[var(--surface-3)] transition-colors whitespace-nowrap">
                {{ child.label }}
              </a>
            </div>
          </div>

        </div>
      </ng-container>
    </nav>

    <!-- User Profile Footer -->
    <div *ngIf="user$ | async as user" class="border-t border-[var(--border)] p-4 flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="w-9 h-9 rounded-full bg-[var(--surface-3)] flex items-center justify-center font-bold text-white flex-shrink-0">
          {{ getInitials(user.name) }}
        </div>
        <div *ngIf="isSidebarExpanded" class="flex flex-col whitespace-nowrap">
          <span class="text-sm font-medium text-white truncate max-w-[120px]" [title]="user.name">{{ user.name }}</span>
          <span class="text-xs text-[var(--primary)]">{{ getRoleLabel(user.role) }}</span>
        </div>
      </div>
      <button *ngIf="isSidebarExpanded" (click)="logout()" class="text-[var(--text-secondary)] hover:text-[var(--danger)]" title="Logout">
        <span class="w-5 h-5 block text-center">🚪</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden w-full">
    <!-- Header for mobile -->
    <header class="md:hidden h-16 bg-[var(--surface-2)] border-b border-[var(--border)] flex items-center justify-between px-4 shrink-0">
      <button (click)="toggleMobileMenu()" class="text-[var(--text-secondary)] hover:text-white">
        ☰
      </button>
      <span class="font-bold text-white text-lg">ClassForge</span>
      <div class="w-8"></div> <!-- spacer -->
    </header>

    <!-- Main Router Outlet -->
    <main class="flex-1 overflow-hidden bg-[var(--surface-1)]">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Fase 9: Asistente de Soporte en Tiempo Real y Spotlight Tour Overlay (Estilo Canva) -->
  <app-tour-overlay></app-tour-overlay>
  <app-support-assistant></app-support-assistant>
</div>
